<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Recruitment & Placement Management System</title><link rel="stylesheet" href="css/style.css"></head><body class="loginbody"><section class="loginbox"><div class="brand"><div class="logo">RP</div><span>Kiran Academy</span></div><h1>Recruitment & Placement<br>Management System</h1><p>Sign in to continue to your workspace</p><form action="dashboard.html"><div class="field"><label>Username / Email *</label><input type="email" placeholder="recruiter@demo.com" required></div><div class="field"><label>Password *</label><input type="password" placeholder="Enter password" required></div><div class="field"><label>Role *</label><select required><option value="">Select role</option><option>Admin</option><option>Recruiter</option><option>Placement Officer</option></select></div><p style="text-align:right;margin:0 0 14px"><a href="#">Forgot Password?</a></p><button type="submit">Login</button><button type="reset" class="secondary" style="margin-top:9px">Reset</button></form><div class="notice">Authorized users only. Demo login is a static prototype.</div></section></body></html>
